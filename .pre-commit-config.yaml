# Optional, but recommended:  pip install pre-commit && pre-commit install
# CI runs the same two linters with the same configuration.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(run\.sh|batch_run\.sh|install\.sh|test/run_demo\.sh)$
