# ------------------------------------------------------------------
# nanotyper Snakemake workflow configuration (pipeline defaults)
#
# Users override any key by placing a config.yaml with only the changed keys
# in their analysis folder; run.sh passes it with --configfile.
# ------------------------------------------------------------------

# ---- scheme pack ----
# Directory name under schemes/. Everything organism-specific (loci, reference
# genes, primers, PubMLST database) comes from schemes/<scheme>/scheme.yaml.
scheme: "ecoli_achtman"

# ---- paths (relative to the analysis directory where you run snakemake) ----
paths:
  samplesheet: "samplesheet.csv"
  results_dir: "results"
  # Used to fill in fastq_dir for samplesheet rows that don't specify one.
  # Placeholders: {sample_id}, {run_id}, {barcode}. Relative paths resolve
  # against your analysis directory (cwd); ~ expands to home.
  fastq_dir_template: "fastq_pass/{barcode}"

# ---- medaka consensus ----
# The model is chemistry-specific (flow cell + basecalling mode), not
# organism-specific, so it lives here rather than in the scheme pack.
medaka:
  model: "r1041_e82_400bps_sup_v5.0.0"
  threads: 4

# ---- BLAST allele calling ----
blast:
  min_identity: 100.0          # percent identity required for a "known" allele
  require_full_length: true    # length must equal query length (full-length hit)
  max_target_seqs: 1

# ---- cutadapt primer coverage ----
cutadapt:
  error_rate: 0.1

# ---- QC thresholds ----
# Override the scheme pack's qc_defaults here (reads carrying both primers).
# QC label priority: FAIL > LOW_COVERAGE > NEW_ALLELE > NEW_ST > PASS
qc:
  coverage_good: 100    # >= this coverage at a locus = PASS-eligible
  coverage_warn: 50     # below this = FAIL for that locus

# ---- default resources ----
resources:
  threads: 4
