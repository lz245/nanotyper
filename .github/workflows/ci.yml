name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches a bioconda release that breaks an environment before a user does.
    - cron: "23 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback: pure-Python logic (MLST calling, QC tiers, samplesheet
  # lint, fetch-script parsing). No conda, no tools — about a minute.
  # ---------------------------------------------------------------------
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas pyyaml
      - name: Unit tests
        run: python -m pytest test/ -v
      - name: Every script at least parses
        run: |
          for f in $(git ls-files '*.py'); do python -m py_compile "$f" || exit 1; done
          for f in $(git ls-files '*.sh') bin/nanotyper; do bash -n "$f" || exit 1; done

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: python -m pip install --upgrade pip ruff shellcheck-py "snakemake>=8" pandas pyyaml
      - name: ruff
        run: ruff check .
      - name: shellcheck
        run: shellcheck $(git ls-files '*.sh') bin/nanotyper
      - name: snakemake --lint (parses the workflow with the demo samplesheet)
        working-directory: test/demo
        run: snakemake --snakefile ../../Snakefile --lint || true

  # ---------------------------------------------------------------------
  # Does the documented install actually work, and does the pipeline call
  # the demo STs? Real PubMLST download, real conda environments (cached on
  # the env files), real medaka/BLAST/cutadapt/R run on 4 barcodes.
  # ---------------------------------------------------------------------
  demo:
    name: demo (ubuntu, full run)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true

      - name: Cache conda environments
        uses: actions/cache@v4
        with:
          path: .snakemake/conda
          key: conda-envs-${{ runner.os }}-${{ hashFiles('workflow/envs/*.yaml') }}

      - name: install.sh (snakemake + PubMLST snapshot)
        shell: bash -el {0}
        run: ./install.sh

      - name: Snapshot in use
        shell: bash -el {0}
        run: python3 tools/fetch_pubmlst.py ecoli_achtman --check

      - name: Run the demo
        shell: bash -el {0}
        run: test/run_demo.sh -j 4

      - name: Upload demo results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            test/demo/results/mlst_summary.tsv
            test/demo/results/provenance.yaml
            test/demo/results/mlst_report.html
            test/demo/run.log
          if-no-files-found: ignore
