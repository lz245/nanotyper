$schema: "http://json-schema.org/draft-07/schema#"
title: "nanotyper workflow configuration"
type: object

properties:
  scheme:
    type: string
    pattern: "^[A-Za-z0-9_.-]+$"
    description: "Scheme pack directory name under schemes/ (e.g. ecoli_achtman)."
  schemes_dir:
    type: string
    description: "Optional override of the schemes/ directory (absolute path)."

  paths:
    type: object
    properties:
      samplesheet:         { type: string }
      results_dir:         { type: string }
      fastq_dir_template:
        type: string
        description: >
          Template used to fill in fastq_dir for samplesheet rows that
          don't specify one explicitly. Placeholders: {sample_id},
          {run_id}, {barcode}. Relative paths resolve against the
          analysis directory (cwd); ~ expands to home.
    required:
      - samplesheet
      - results_dir

  medaka:
    type: object
    properties:
      model:   { type: string }
      threads: { type: integer, minimum: 1 }
    required: [model]

  blast:
    type: object
    properties:
      min_identity:        { type: number,  minimum: 0, maximum: 100 }
      require_full_length: { type: boolean }
      max_target_seqs:     { type: integer, minimum: 1 }

  cutadapt:
    type: object
    properties:
      error_rate:   { type: number, minimum: 0, maximum: 1 }

  qc:
    type: object
    properties:
      coverage_good: { type: integer, minimum: 0 }
      coverage_warn: { type: integer, minimum: 0 }
    required: [coverage_good, coverage_warn]

  resources:
    type: object
    properties:
      threads: { type: integer, minimum: 1 }

required:
  - scheme
  - paths
  - medaka
  - blast
  - cutadapt
  - qc
