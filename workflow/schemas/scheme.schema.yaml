$schema: "http://json-schema.org/draft-07/schema#"
title: "nanotyper scheme pack (schemes/<name>/scheme.yaml)"
type: object
properties:
  name:        { type: string, pattern: "^[A-Za-z0-9_.-]+$" }
  organism:    { type: string, minLength: 1 }
  description: { type: string }
  pubmlst:
    type: object
    properties:
      database:  { type: string, minLength: 1 }
      scheme_id: { type: integer, minimum: 1 }
    required: [database, scheme_id]
  loci:
    type: array
    items: { type: string, pattern: "^[A-Za-z0-9_]+$" }
    minItems: 1
    uniqueItems: true
  amplicon_bp:
    type: object
    additionalProperties: { type: integer, minimum: 1 }
  reference: { type: string, minLength: 1 }
  primers:   { type: string, minLength: 1 }
  qc_defaults:
    type: object
    properties:
      coverage_good:       { type: integer, minimum: 0 }
      coverage_warn:       { type: integer, minimum: 0 }
      min_locus_share_pct: { type: number,  minimum: 0, maximum: 100 }
required: [name, organism, pubmlst, loci, reference, primers]
